name: Push

# This workflow pushes multiple quickstart images that have been built with the
# build.yml. This workflow and the build.yml workflow are coupled, and this
# workflow makes assumptions about what artifact names the images hae been
# saved under. This workflow is not intended to be called by third parties.

on:
  workflow_call:
    inputs:
      sha:
        description: 'Sha to connect push status notifications to'
        type: "string"
        required: true
      tags:
        description: 'Tags to push (e.g. ["latest", "testing", ...])'
        type: "string"
        required: true
      archs:
        description: 'Architectures to push for as an array (e.g. ["amd64", "arm64"])'
        type: "string"
        required: true
      tag-prefix:
        description: "Tag prefix for the image when pushed (e.g. pr877-v21-)"
        type: "string"
        required: true
      tag-alias-prefix:
        description: "A second tag prefix for the image when pushed that'll be pushed in addition as an alias (e.g. pr877-)"
        type: "string"
        required: true
      registry_repo:
        description: "Repo at the registry to push to"
        type: "string"
        required: true
    secrets:
      registry:
        description: "Registry to push to"
      registry_username:
        description: "Username to auth with the registry"
      registry_password:
        description: "Password to auth with the registry"

jobs:

  complete:
    if: always()
    name: complete
    needs: [push, push-manifest, push-alias]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1

  push:
    strategy:
      matrix:
        tag: ${{ fromJSON(inputs.tags) }}
        arch: ${{ fromJSON(inputs.archs) }}
      fail-fast: false
    name: 1 push (${{ matrix.tag }}, ${{ matrix.arch }})
    permissions:
      attestations: write
      id-token: write
      packages: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
    - name: Create Tag
      id: tag
      run: echo "tag=${{ inputs.tag-prefix }}${{ matrix.tag }}-${{ matrix.arch }}" | tee -a $GITHUB_OUTPUT
    - name: Download Image from Artifacts
      uses: actions/download-artifact@v4
      with:
        name: image-quickstart-${{ matrix.tag }}-${{ matrix.arch }}.tar
        path: /tmp/
    - name: Load Image
      run: docker load -i /tmp/image
    - name: Tag Image
      run: >
        docker tag
        quickstart:${{ matrix.tag }}-${{ matrix.arch }}
        ${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}
    - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
      with:
        registry: ${{ secrets.registry }}
        username: ${{ secrets.registry_username }}
        password: ${{ secrets.registry_password }}
    - name: Push Image
      env:
        image: ${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}
      run: |
        for delay in 2 4 8 16; do
          docker push "$image" && exit 0
          echo "docker push failed, retrying in ${delay}s"
          sleep "$delay"
        done
        docker push "$image"
    - name: Image Digest
      id: digest
      if: github.ref == 'refs/heads/main'
      env:
        image: ${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}
      run: |
        set -o pipefail
        inspect() {
          docker buildx imagetools inspect --format '{{json .Manifest}}' "$image" | jq -r '.digest'
        }
        for delay in 2 4 8 16; do
          digest="$(inspect)" && break
          echo "docker buildx imagetools inspect failed, retrying in ${delay}s"
          sleep "$delay"
        done
        digest="${digest:-$(inspect)}"
        echo "digest=$digest" | tee -a $GITHUB_OUTPUT
    # Attesting talks to Sigstore and Rekor, which intermittently fail, and the
    # action has no retry of its own, so attempt it a second time on failure.
    - name: Attest Image
      id: attest
      if: github.ref == 'refs/heads/main'
      continue-on-error: true
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ secrets.registry }}/${{ inputs.registry_repo }}
        subject-digest: ${{ steps.digest.outputs.digest }}
    - name: Attest Image Retry
      if: github.ref == 'refs/heads/main' && steps.attest.outcome == 'failure'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ secrets.registry }}/${{ inputs.registry_repo }}
        subject-digest: ${{ steps.digest.outputs.digest }}
    - name: Post Status with Image Name
      uses: actions/github-script@v8
      # The status is informational and is posted after the image is already in
      # the registry, so a failure here must not fail an otherwise good push.
      continue-on-error: true
      with:
        retries: 3
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: '${{ inputs.sha }}',
            state: 'success',
            context: `${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}`,
            description: 'Available',
          });

  push-manifest:
    needs: push
    strategy:
      matrix:
        tag: ${{ fromJSON(inputs.tags) }}
      fail-fast: false
    name: 2 push manifest (${{ matrix.tag }})
    permissions:
      attestations: write
      id-token: write
      packages: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
    - name: Create Tag
      id: tag
      run: |
        echo "tag=${{ inputs.tag-prefix }}${{ matrix.tag }}" | tee -a $GITHUB_OUTPUT
    - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
      with:
        registry: ${{ secrets.registry }}
        username: ${{ secrets.registry_username }}
        password: ${{ secrets.registry_password }}
    - name: Prepare Image List
      id: images
      env:
        archs: ${{ inputs.archs }}
      run: |
        images="$(<<< $archs jq -r 'map("${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}-\(.)") | join(" ")')"
        echo "images=$images" | tee -a $GITHUB_OUTPUT
    - name: Create Manifest
      env:
        image: ${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}
        images: ${{ steps.images.outputs.images }}
      run: |
        for delay in 2 4 8 16; do
          docker manifest create "$image" $images && exit 0
          echo "docker manifest create failed, retrying in ${delay}s"
          sleep "$delay"
          # A partially created manifest list stays in the local store and
          # would block the retry, so discard it before trying again.
          docker manifest rm "$image" > /dev/null 2>&1 || true
        done
        docker manifest create "$image" $images
    - name: Push Manifest
      env:
        image: ${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}
      run: |
        for delay in 2 4 8 16; do
          docker manifest push "$image" && exit 0
          echo "docker manifest push failed, retrying in ${delay}s"
          sleep "$delay"
        done
        docker manifest push "$image"
    - name: Image Digest
      id: digest
      if: github.ref == 'refs/heads/main'
      env:
        image: ${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}
      run: |
        set -o pipefail
        inspect() {
          docker buildx imagetools inspect --format '{{json .Manifest}}' "$image" | jq -r '.digest'
        }
        for delay in 2 4 8 16; do
          digest="$(inspect)" && break
          echo "docker buildx imagetools inspect failed, retrying in ${delay}s"
          sleep "$delay"
        done
        digest="${digest:-$(inspect)}"
        echo "digest=$digest" | tee -a $GITHUB_OUTPUT
    # Attesting talks to Sigstore and Rekor, which intermittently fail, and the
    # action has no retry of its own, so attempt it a second time on failure.
    - name: Attest Image
      id: attest
      if: github.ref == 'refs/heads/main'
      continue-on-error: true
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ secrets.registry }}/${{ inputs.registry_repo }}
        subject-digest: ${{ steps.digest.outputs.digest }}
    - name: Attest Image Retry
      if: github.ref == 'refs/heads/main' && steps.attest.outcome == 'failure'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ secrets.registry }}/${{ inputs.registry_repo }}
        subject-digest: ${{ steps.digest.outputs.digest }}
    - uses: actions/github-script@v8
      # The status is informational and is posted after the image is already in
      # the registry, so a failure here must not fail an otherwise good push.
      continue-on-error: true
      with:
        retries: 3
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: '${{ inputs.sha }}',
            state: 'success',
            context: '${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}',
            description: 'Available',
          });

  push-alias:
    needs: push-manifest
    strategy:
      matrix:
        tag: ${{ fromJSON(inputs.tags) }}
      fail-fast: false
    name: 3 push alias (${{ matrix.tag }})
    permissions:
      packages: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
    - name: Create Tag
      id: tag
      run: |
        echo "tag=${{ inputs.tag-prefix }}${{ matrix.tag }}" | tee -a $GITHUB_OUTPUT
        echo "tag-alias=${{ inputs.tag-alias-prefix }}${{ matrix.tag }}" | tee -a $GITHUB_OUTPUT
    - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
      with:
        registry: ${{ secrets.registry }}
        username: ${{ secrets.registry_username }}
        password: ${{ secrets.registry_password }}
    - name: Push Alias
      env:
        alias: ${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag-alias }}
        image: ${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag }}
      run: |
        for delay in 2 4 8 16; do
          docker buildx imagetools create -t "$alias" "$image" && exit 0
          echo "docker buildx imagetools create failed, retrying in ${delay}s"
          sleep "$delay"
        done
        docker buildx imagetools create -t "$alias" "$image"
    - uses: actions/github-script@v8
      # The status is informational and is posted after the image is already in
      # the registry, so a failure here must not fail an otherwise good push.
      continue-on-error: true
      with:
        retries: 3
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: '${{ inputs.sha }}',
            state: 'success',
            context: '${{ secrets.registry }}/${{ inputs.registry_repo }}:${{ steps.tag.outputs.tag-alias }}',
            description: 'Available',
          });
